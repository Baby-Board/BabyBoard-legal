# Publie les pages légales sur GitHub Pages.
#
# `enablement: true` sur configure-pages active Pages sur le dépôt au premier
# passage, via l'API : il n'y a donc rien à cocher à la main dans les réglages
# du dépôt, et le workflow reste reproductible si le dépôt est recréé.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle en cours : deux pushes
# rapprochés ne doivent pas laisser le site sur une version intermédiaire.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
